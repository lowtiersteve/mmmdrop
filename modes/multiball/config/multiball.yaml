#config_version=6

#This is ChCheckItOut!!

mode:
  start_events: mode_base_started
  priority: 1000

multiballs:
  chcheckitout:
    ball_count: 3
    start_events: chcheckitout_start_multiball
    shoot_again: 15s
    add_a_ball_events: three_bank_standup_hit
    reset_events: multiball_chcheckitout_ended
    enable_events: chcheckitout_multiball_qualified
  makesomenoise:
    ball_count: 2
    start_events: timer_makesomenoise_intro_show_complete
    shoot_again: 15s
    reset_events: multiball_makesomenoise_ended
    enable_events: mode_makesomenoise_starting


slide_player:
  multiball_chcheckitout_started:
    current_mode_highlighted:
      action: remove
    base:
      action: remove
    basevideo1:
      action: remove
    basevideo2:
      action: remove
    basevideo3:
      action: remove
    basevideo4:
      action: remove
  play_chcheckitout_video1:
    multiball1:
      action: play
      priority: 450000
  play_chcheckitout_video2:
    multiball2:
      action: play
      priority: 450000
  play_chcheckitout_video3:
    multiball3:
      action: play
      priority: 450000

sound_player:
  multiball_chcheckitout_started{current_player.mode_blocking_flag==0}:
    chcheckitoutmultiballmusic:
      action: play
      bus: music
      loops: 5


variable_player:
  multiball_chcheckitout_started:
    multiball_blocking_flag:
      int: 1
      action: set
  multiball_chcheckitout_ended:
    multiball_blocking_flag:
      int: 0
      action: set
