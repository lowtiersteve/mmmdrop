#config_version=6

#This is ChCheckItOut!!

mode:
  start_events: mode_base_started
  priority: 1000

multiballs:
  chcheckitout:
    ball_count: 3
    start_events: chcheckitout_start_multiball
    shoot_again: 15s
    add_a_ball_events: three_bank_standup_hit
    reset_events: multiball_chcheckitout_ended
    enable_events: chcheckitout_multiball_qualified
  makesomenoise:
    ball_count: 2
    start_events: timer_makesomenoise_intro_show_complete
    shoot_again: 15s
    reset_events: multiball_makesomenoise_ended
    enable_events: mode_makesomenoise_starting


slide_player:
  multiball_chcheckitout_started:
    current_mode_highlighted:
      action: remove
    base:
      action: remove
    basevideo1:
      action: remove
    basevideo2:
      action: remove
    basevideo3:
      action: remove
    basevideo4:
      action: remove
  play_chcheckitout_video1:
    multiball1:
      action: play
      priority: 450000
  play_chcheckitout_video2:
    multiball2:
      action: play
      priority: 450000
  play_chcheckitout_video3:
    multiball3:
      action: play
      priority: 450000

sound_player:
  multiball_chcheckitout_started{current_player.mode_blocking_flag==0}:
    chcheckitoutmultiballmusic:
      action: play
      bus: music
      loops: 5

variable_player:
  multiball_chcheckitout_started:
    multiball_blocking_flag:
      int: 1
      action: set
  multiball_chcheckitout_ended:
    multiball_blocking_flag:
      int: 0
      action: set
  chcheckitout_jackpot_hit:
    score: 500000
    multiball_chcheckitout_score: 500000
  chcheckitout_superjackpot_hit:
    score: 2000000
    multiball_chcheckitout_score: 2000000

accruals:
  completing_chcheckitout_jackpots:
    events:
      - chcheckitout_leftorbit_jackpot_hit
      - chcheckitout_leftramp_jackpot_hit
      - chcheckitout_rightramp_jackpot_hit
      - chcheckitout_rightorbit_jackpot_hit
    events_when_complete: chcheckitout_superjackpot_lit
    restart_events: chcheckitout_superjackpot_hit

sequences:
  chcheckitout_superjackpot:
    events:
      - inner_loop_hit
    enable_events: chcheckitout_superjackpot_lit
    events_when_complete: chcheckitout_superjackpot_hit
    reset_on_complete: True
    restart_events: chcheckitout_superjackpot_lit
  chcheckitout_leftorbit_jackpot:
    events:
      - left_orbit_hit
    enable_events: multiball_chcheckitout_started, chcheckitout_superjackpot_hit
    events_when_complete: chcheckitout_leftorbit_jackpot_hit, chcheckitout_jackpot_hit
    reset_on_complete: false
    restart_events: chcheckitout_superjackpot_hit
  chcheckitout_leftramp_jackpot:
    events:
      - left_ramp_hit
    enable_events: multiball_chcheckitout_started, chcheckitout_superjackpot_hit
    events_when_complete: chcheckitout_leftramp_jackpot_hit, chcheckitout_jackpot_hit
    reset_on_complete: false
    restart_events: chcheckitout_superjackpot_hit
  chcheckitout_rightramp_jackpot:
    events:
      - right_ramp_hit
    enable_events: multiball_chcheckitout_started, chcheckitout_superjackpot_hit
    events_when_complete: chcheckitout_rightramp_jackpot_hit, chcheckitout_jackpot_hit
    reset_on_complete: false
    restart_events: chcheckitout_superjackpot_hit
  chcheckitout_rightorbit_jackpot:
    events:
      - right_orbit_hit
    enable_events: multiball_chcheckitout_started, chcheckitout_superjackpot_hit
    events_when_complete: chcheckitout_rightorbit_jackpot_hit, chcheckitout_jackpot_hit
    reset_on_complete: false
    restart_events: chcheckitout_superjackpot_hit

show_player:
  multiball_chcheckitout_started:
    chcheckitout_left_orbit_shot:
      action: play
      loops: -1
    chcheckitout_left_ramp_shot:
      action: play
      loops: -1
    chcheckitout_right_ramp_shot:
      action: play
      loops: -1
    chcheckitout_right_orbit_shot:
      action: play
      loops: -1
  chcheckitout_leftorbit_jackpot_hit:
    chcheckitout_left_orbit_shot:
      action: stop
  chcheckitout_leftramp_jackpot_hit:
    chcheckitout_left_ramp_shot:
      action: stop
  chcheckitout_rightramp_jackpot_hit:
    chcheckitout_right_ramp_shot:
      action: stop
  chcheckitout_rightorbit_jackpot_hit:
    chcheckitout_right_orbit_shot:
      action: stop
  chcheckitout_superjackpot_lit:
    chcheckitout_inner_loop_shot:
      action: play
      loops: -1
  chcheckitout_superjackpot_hit:
    chcheckitout_inner_loop_shot:
      action: stop
    chcheckitout_left_orbit_shot:
      action: play
      loops: -1
    chcheckitout_left_ramp_shot:
      action: play
      loops: -1
    chcheckitout_right_ramp_shot:
      action: play
      loops: -1
    chcheckitout_right_orbit_shot:
      action: play
      loops: -1
  multiball_chcheckitout_ended:
    chcheckitout_inner_loop_shot:
      action: stop
    chcheckitout_left_orbit_shot:
      action: stop
    chcheckitout_left_ramp_shot:
      action: stop
    chcheckitout_right_ramp_shot:
      action: stop
    chcheckitout_right_orbit_shot:
      action: stop

