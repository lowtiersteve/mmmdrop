#config_version=6

mode:
  start_events: ball_started
  stop_events:
    - skill_success
    - skill_failed
  priority: 500

shots:
  skill_side_targets:
    switch: s_tshirt_bottom_standup, s_tshirt_top_standup
    profile: skill_shot_profile
    advance_events: mode_skill_shot_started
  skill_drop_targets:
    switch: s_three_bank_bottom, s_three_bank_middle, s_three_bank_top
    profile: skill_shot_profile
    advance_events: mode_skill_shot_started

shot_groups:
  skill_shot:
    shots: skill_side_targets, skill_drop_targets
    rotate_left_events: s_left_flipper_active
    rotate_right_events: s_right_flipper_active

shot_profiles:
  skill_shot_profile:
    states:
      - name: unlit
        show: off
      - name: flashing
        show: flash_color
        show_tokens:
          color: red
        speed: 4
    loop: true


variable_player:
  skill_success:
    score: 2000000

timers:
  skill_shot_timeout:
    start_value: 0
    end_value: 3
    direction: up
    tick_interval: 1
    start_running: false
    control_events:
      - action: start
        event: balldevice_bd_plunger_ball_eject_success
      - action: reset
        event: ball_starting

state_machines:
  skill_shot_success:
    debug: true
    states:
      start:
        label: Skill shot ready
      success:
        label: Skill successful
        events_when_started: skill_success
      failed:
        label: Skill failed
        events_when_started: skill_failed
    transitions:
      - source: start
        target: success
        events: skill_shot_flashing_hit
      - source: start
        target: failed
        events: skill_shot_unlit_hit, timer_skill_shot_timeout_complete

slide_player:
  mode_skill_shot_started:
    skillshot_overlay:
      action: play
      priority: 850000
  skill_success:
    skillshot_overlay:
      action: remove
  skill_failed:
    skillshot_overlay:
      action: remove