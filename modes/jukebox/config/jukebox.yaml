#  carousel_item_highlighted{carousel=="jukebox" and item!="licensedtoillB"}: killlicensedtoillB
  carousel_item_highlighted{carousel=="jukebox" and item=="paulsboutiqueA"}: paulsboutiqueA
  carousel_item_highlighted{carousel=="jukebox" and item=="paulsboutiqueB"}: paulsboutiqueB
