#  carousel_item_highlighted{carousel=="jukebox" and item!="paulsboutiqueB"}: killpaulsboutiqueB
  carousel_item_highlighted{carousel=="jukebox" and item=="checkyourheadA"}: checkyourheadA
  carousel_item_highlighted{carousel=="jukebox" and item=="checkyourheadB"}: checkyourheadB
#  carousel_item_highlighted{carousel=="jukebox" and item!="checkyourheadA"}: killcheckyourheadA
#  carousel_item_highlighted{carousel=="jukebox" and item!="checkyourheadB"}: killcheckyourheadB
  carousel_item_highlighted{carousel=="jukebox" and item=="illcommunicationA"}: illcommunicationA
  carousel_item_highlighted{carousel=="jukebox" and item=="illcommunicationB"}: illcommunicationB
#  carousel_item_highlighted{carousel=="jukebox" and item!="illcommunicationA"}: killillcommunicationA
#  carousel_item_highlighted{carousel=="jukebox" and item!="illcommunicationB"}: killillcommunicationB
  carousel_item_highlighted{carousel=="jukebox" and item=="hellonastyA"}: hellonastyA
  carousel_item_highlighted{carousel=="jukebox" and item=="hellonastyB"}: hellonastyB
#  carousel_item_highlighted{carousel=="jukebox" and item!="hellonastyA"}: killhellonastyA
#  carousel_item_highlighted{carousel=="jukebox" and item!="hellonastyB"}: killhellonastyB
  carousel_item_highlighted{carousel=="jukebox" and item=="tothe5boroughsA"}: tothe5boroughsA
  carousel_item_highlighted{carousel=="jukebox" and item=="tothe5boroughsB"}: tothe5boroughsB
#  carousel_item_highlighted{carousel=="jukebox" and item!="tothe5boroughsA"}: killtothe5boroughsA
#  carousel_item_highlighted{carousel=="jukebox" and item!="tothe5boroughsB"}: killtothe5boroughsB
  carousel_item_highlighted{carousel=="jukebox" and item=="themixupA"}: themixupA
  carousel_item_highlighted{carousel=="jukebox" and item=="themixupB"}: themixupB
#  carousel_item_highlighted{carousel=="jukebox" and item!="themixupA"}: killthemixupA
#  carousel_item_highlighted{carousel=="jukebox" and item!="themixupB"}: killthemixupB
  carousel_item_highlighted{carousel=="jukebox" and item=="hotsaucecommitteeparttwoA"}: hotsaucecommitteeparttwoA
  carousel_item_highlighted{carousel=="jukebox" and item=="hotsaucecommitteeparttwoB"}: hotsaucecommitteeparttwoB
#  carousel_item_highlighted{carousel=="jukebox" and item!="hotsaucecommitteeparttwoA"}: killhotsaucecommitteeparttwoA
#  carousel_item_highlighted{carousel=="jukebox" and item!="hotsaucecommitteeparttwoB"}: killhotsaucecommitteeparttwoB
  s_right_flipper_active: killlicensedtoillA, killlicensedtoillB, killpaulsboutiqueA, killpaulsboutiqueB, killcheckyourheadA, killcheckyourheadB, killillcommunicationA, killillcommunicationB, killhellonastyA, killhellonastyB, killtothe5boroughsA, killtothe5boroughsB, killthemixupA, killthemixupB, killhotsaucecommitteeparttwoA, killhotsaucecommitteeparttwoB


timers:
  end_jukebox_timer:
    start_value: 0
    end_value: 2
    tick_interval: 1s
    start_running: False
    restart_on_complete: False
    control_events:
      - event: flipper_cradle
        action: restart
      - event: flipper_cradle_release{device.timers.end_jukebox_timer.running==True}
        action: stop


