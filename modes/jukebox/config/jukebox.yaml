#config_version=6

mode:
  start_events: start_jukebox
  stop_events: end_jukebox
  game_mode: False
  code: mpf.modes.carousel.code.carousel.Carousel
  priority: 2000


mode_settings:
  selectable_items:
    - licensedtoillA
    - licensedtoillB
    - paulsboutiqueA
    - paulsboutiqueB
    - checkyourheadA
    - checkyourheadB
    - illcommunicationA
    - illcommunicationB
    - hellonastyA
    - hellonastyB
    - tothe5boroughsA
    - tothe5boroughsB
    - themixupA
    - themixupB
    - hotsaucecommitteeparttwoA
    - hotsaucecommitteeparttwoB
