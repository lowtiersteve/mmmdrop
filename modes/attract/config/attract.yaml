mode_settings:
  selectable_items:
    - gameover{machine.game_just_played==1}
    - last_scores_1p{machine.game_just_played==1 and not machine.player2_score>0}
    - last_scores_2p{machine.player2_score>0 and machine.game_just_played==1 and not machine.player3_score>0}
    - last_scores_3p{machine.player3_score>0 and machine.game_just_played==1 and not machine.player4_score>0}
    - last_scores_4p{machine.player4_score>0}
    - mpf_logo
    - fast_logo
    - specialthanks
    - credits
    - pressstart
    - version
    - makercredits
    - dedicated
#    - highscoregrandchampion
#    - highscore1
#    - highscore2
#    - highscore3
#    - highscore4
#    - highscoremultiballs
