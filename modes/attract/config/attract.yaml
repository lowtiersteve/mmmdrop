slide_player:
  mode_attract_started{machine.game_just_played==0}:
    loading:
      action: remove
    attract_load:
      action: play
      priority: 1000000
  timer_attract_intro_timer_complete{machine.game_just_played==0}:
    attract_load:
      action: remove
    attract:
      action: play
      priority: 1000
  mode_attract_started{machine.game_just_played==1}:
    loading:
      action: remove
    attract:
      action: play
      priority: 1000
  mca_sequence_hit:
    attract_load:
      action: remove
    attract:
      action: remove
    ghostbusters:
      action: play
      priority: 1100000
  timer_mca_attract_video_timer_complete:
    ghostbusters:
      action: remove
    attract:
      action: play
      priority: 1000
  adr_sequence_hit:
    attract_load:
      action: remove
    attract:
      action: remove
    friends:
      action: play
      priority: 1100000
  timer_adr_attract_video_timer_complete:
    friends:
      action: remove
    attract:
      action: play
      priority: 1000
  christmas_sequence_hit:
    attract_load:
      action: remove
    attract:
      action: remove
    jinglebells:
      action: play
      priority: 1100000
  timer_christmas_attract_video_timer_complete:
    jinglebells:
      action: remove
    attract:
      action: play
      priority: 1000
  flipper_cancel:
    friends:
      action: remove
    ghostbusters:
      action: remove
    jinglebells:
      action: remove
    attract:
        action: play
        priority: 1000

sound_player:
  mode_attract_started:
    attract_crowd:
      bus: effects
      action: play
  mca_sequence_hit:
    attract_crowd:
      action: stop
      bus: effects
  timer_mca_attract_video_timer_complete:
    attract_crowd:
      bus: effects
      action: play
  adr_sequence_hit:
    attract_crowd:
      action: stop
      bus: effects
  timer_adr_attract_video_timer_complete:
    attract_crowd:
      bus: effects
      action: play
  christmas_sequence_hit:
    attract_crowd:
      action: stop
      bus: effects
  timer_christmas_attract_video_timer_complete:
    attract_crowd:
      bus: effects
      action: play


timers:
  attract_carousel_timer:
    end_value: 5
    tick_interval: 1s
    start_running: False
    control_events:
      - event: item_highlighted
        action: restart
      - event: flipper_cradle
        action: stop
      - event: flipper_cradle_release
        action: restart
      - event: timer_attract_intro_timer_complete
        action: start
      - event: game_ended
        action: start
      - event: mca_sequence_hit
        action: pause
      - event: adr_sequence_hit
        action: pause
      - event: slide_ghostbusters_removed
        action: restart
      - event: slide_friends_removed
        action: restart
  attract_intro_timer:
    end_value: 16
    tick_interval: 1s
    start_running: True
    control_events:
      - event: mode_attract_started{machine.game_just_played==0}
        action: restart
      - event: game_started
        action: stop
  mca_attract_video_timer:
    end_value: 192
    tick_interval: 1s
    start_running: False
    control_events:
      - event: slide_ghostbusters_active
        action: start
      - event: game_started
        action: stop
  adr_attract_video_timer:
    end_value: 49
    tick_interval: 1s
    start_running: False
    control_events:
      - event: slide_friends_active
        action: start
      - event: game_started
        action: stop
  christmas_attract_video_timer:
    end_value: 54
    tick_interval: 1s
    start_running: False
    control_events:
      - event: slide_jinglebells_active
        action: start
      - event: game_started
        action: stop


