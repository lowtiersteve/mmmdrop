#config_version=6

mode_settings:
  display_delay_ms: 2000
  hurry_up_delay_ms: 400
  hurry_up_event: flipper_cancel
  bonus_entries:
    - entry: bonus_modes_played
      score: 100000
      player_score_entry: modes_played
      skip_if_negative: True
    - entry: bonus_modes_completed
      score: 250000
      player_score_entry: modes_completed
      skip_if_negative: True
    - entry: bonus_time_remaining
      score: 1000
      player_score_entry: mode_time_remaining_total
      skip_if_negative: True
    - entry: bonus_combos
      score: 25000
      player_score_entry: combos
      skip_if_negative: True
    - entry: bonus_characters
      score: 200000
      player_score_entry: characters_collected
      skip_if_negative: True
    - entry: bonus_girls_frenzy
      score: 1
      player_score_entry: girls_bonus_score
      skip_if_negative: True


variable_player:
  mode_bonus_started:
    mode_time_remaining_total:
      int: current_player.intergalactic_time_remaining_variable_times_1 + current_player.paulrevere_time_remaining_variable_times_1 + current_player.tripletrouble_time_remaining_variable_times_1 + current_player.sabotage_time_remaining_variable_times_1 + current_player.fingerlickingood_time_remaining_variable_times_1 + current_player.toomanyrappers_time_remaining_variable_times_1 + current_player.threemcsand1dj_time_remaining_variable_times_1 + current_player.highplainsdrifter_time_remaining_variable_times_1
      action: set


slide_player:
  mode_bonus_started:
    bonus_start_slide:
      action: play
      priority: 1000000
  bonus_entry{entry=="bonus_modes_played"}:
    bonus_start_slide:
      action: remove
    bonus_modes_played_slide:
      action: play
      priority: 1000000
  bonus_entry{entry=="bonus_modes_completed"}:
    bonus_start_slide:
      action: remove
    bonus_modes_played_slide:
      action: remove
    bonus_modes_completed_slide:
      action: play
      priority: 1000000
  bonus_entry{entry=="bonus_time_remaining"}:
    bonus_start_slide:
      action: remove
