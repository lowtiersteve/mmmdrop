    bonus_combos_slide:
      action: remove
    bonus_characters_slide:
      action: remove
    bonus_girls_slide:
      action: remove
    bonus_subtotal_slide:
      action: remove
    bonus_multiplier_slide:
      action: play
      priority: 1000000
  bonus_entry{entry=="total"}:
