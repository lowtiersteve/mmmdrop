      action: remove
    bonus_modes_played_slide:
      action: remove
    bonus_modes_completed_slide:
      action: remove
    bonus_time_remaining:
      action: remove
    bonus_combos_slide:
      action: remove
    bonus_characters_slide:
      action: remove
    bonus_girls_slide:
