#config_version=6

mode:
  start_events: carousel_item_selected{item=="highplainsdrifter"}
  stop_events: mode_highplainsdrifter_stop, mode_highplainsdrifter_failed, mode_highplainsdrifter_success, ball_will_end
  priority: 1000


counters:
  highplainsdrifter_shots_counter:
    count_events: highplainsdrifter_second_shot_hit
    events_when_complete: highplainsdrifter_shots_counter_complete
    starting_count: 3
    count_complete_value: 0
    count_interval: 1
    direction: down
    persist_state: False
    disable_on_complete: False
    reset_on_complete: False
    disable_events: mode_highplainsdrifter_ended
    enable_events: mode_highplainsdrifter_started
    restart_events: mode_highplainsdrifter_started
    control_events:
      - event: reset_highplainsdrifter_shots_counter
        action: jump
        value: 3


sequences:
  highplainsdrifter_left_orbit:
    events:
      - left_orbit_hit
    events_when_complete: highplainsdrifter_left_orbit_1_done
    disable_events: left_ramp_hit, inner_loop_hit, right_ramp_hit, right_orbit_hit
    reset_on_complete: False
    restart_events: timer_highplainsdrifter_intro_show_complete, highplainsdrifter_second_shot_hit{device.counters.highplainsdrifter_shots_counter!=0}
    disable_on_complete: True
  highplainsdrifter_left_orbit_2:
    events:
      - left_orbit_hit
    restart_events: highplainsdrifter_left_orbit_1_done
    events_when_complete: highplainsdrifter_second_shot_hit
    reset_on_complete: False
    disable_on_complete: True
    start_enabled: False
  highplainsdrifter_left_ramp:
    events:
      - left_ramp_hit
    events_when_complete: highplainsdrifter_left_ramp_1_done
    disable_events: left_orbit_hit, inner_loop_hit, right_ramp_hit, right_orbit_hit
    reset_on_complete: False
    restart_events: timer_highplainsdrifter_intro_show_complete, highplainsdrifter_second_shot_hit{device.counters.highplainsdrifter_shots_counter!=0}
    disable_on_complete: True
  highplainsdrifter_left_ramp_2:
    events:
      - left_ramp_hit
    restart_events: highplainsdrifter_left_ramp_1_done
    events_when_complete: highplainsdrifter_second_shot_hit
    reset_on_complete: False
    disable_on_complete: True
    start_enabled: False
  highplainsdrifter_inner_loop:
    events:
      - inner_loop_hit
    events_when_complete: highplainsdrifter_inner_loop_1_done
    disable_events: left_orbit_hit, left_ramp_hit, right_ramp_hit, right_orbit_hit
    reset_on_complete: False
    restart_events: timer_highplainsdrifter_intro_show_complete, highplainsdrifter_second_shot_hit{device.counters.highplainsdrifter_shots_counter!=0}
    disable_on_complete: True
  highplainsdrifter_inner_loop_2:
    events:
      - inner_loop_hit
    restart_events: highplainsdrifter_inner_loop_1_done
    events_when_complete: highplainsdrifter_second_shot_hit
    reset_on_complete: False
    disable_on_complete: True
    start_enabled: False
  highplainsdrifter_right_ramp:
    events:
      - right_ramp_hit
    events_when_complete: highplainsdrifter_right_ramp_1_done
    disable_events: left_orbit_hit, left_ramp_hit, inner_loop_hit, right_orbit_hit
    reset_on_complete: False
    restart_events: timer_highplainsdrifter_intro_show_complete, highplainsdrifter_second_shot_hit{device.counters.highplainsdrifter_shots_counter!=0}
    disable_on_complete: True
  highplainsdrifter_right_ramp_2:
    events:
      - right_ramp_hit
    restart_events: highplainsdrifter_right_ramp_1_done
    events_when_complete: highplainsdrifter_second_shot_hit
    reset_on_complete: False
    disable_on_complete: True
    start_enabled: False
  highplainsdrifter_right_orbit:
    events:
      - right_orbit_hit
    events_when_complete: highplainsdrifter_right_orbit_1_done
    disable_events: left_orbit_hit, left_ramp_hit, inner_loop_hit, right_ramp_hit
    reset_on_complete: False
    restart_events: timer_highplainsdrifter_intro_show_complete, highplainsdrifter_second_shot_hit{device.counters.highplainsdrifter_shots_counter!=0}
    disable_on_complete: True
  highplainsdrifter_right_orbit_2:
    events:
      - right_orbit_hit
    restart_events: highplainsdrifter_right_orbit_1_done
    events_when_complete: highplainsdrifter_second_shot_hit
    reset_on_complete: False
    disable_on_complete: True
    start_enabled: False


variable_player:
  logicblock_highplainsdrifter_shots_counter_hit:
    score: 3000000
    mode_highplainsdrifter_score: 3000000
    highplainsdrifter_shots_remaining:
      int: -1
      action: add
  highplainsdrifter_left_orbit_1_done:
    score: 1500000
    mode_highplainsdrifter_score: 1500000
  highplainsdrifter_left_ramp_1_done:
    score: 1500000
    mode_highplainsdrifter_score: 1500000
  highplainsdrifter_inner_loop_1_done:
    score: 1500000
    mode_highplainsdrifter_score: 1500000
  highplainsdrifter_right_ramp_1_done:
    score: 1500000
    mode_highplainsdrifter_score: 1500000
  highplainsdrifter_right_orbit_1_done:
    score: 1500000
    mode_highplainsdrifter_score: 1500000
  timer_highplainsdrifter_intro_show_tick:
    highplainsdrifter_intro_show_variable_times_100:
      int: device.timers.highplainsdrifter_intro_show.ticks * 100
      action: set
  mode_highplainsdrifter_started:
    mode_blocking_flag:
      int: 1
      action: set
    highplainsdrifter_shots_remaining:
      int: 3
      action: set
  timer_highplainsdrifter_time_remaining_tick:
    highplainsdrifter_time_remaining_variable_times_1:
      int: device.timers.highplainsdrifter_time_remaining.ticks * 1
      action: set


slide_player:
  mode_highplainsdrifter_started:
    current_mode_highlighted:
      action: remove
    base:
      action: remove
    basevideo1:
      action: remove
    basevideo2:
      action: remove
    basevideo3:
      action: remove
    basevideo4:
      action: remove
    highplainsdrifter:
      action: play
      priority: 500000
    highplainsdrifter_instructions:
      action: play
      priority: 500001
      expire: 7s
  flipper_cancel:
    highplainsdrifter_instructions:
      action: remove
  timer_highplainsdrifter_intro_show_complete:
    highplainsdrifter_shots_counter:
      action: play
      priority: 800000
    highplainsdrifter_display_timer:
      action: play
      priority: 1000000
  highplainsdrifter_shots_counter_complete:
    highplainsdrifter_shots_counter:
      action: remove


sound_player:
  mode_highplainsdrifter_started:
    highplainsdriftermusic:
      action: play
      bus: music
  logicblock_highplainsdrifter_shots_counter_hit:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  highplainsdrifter_shots_counter_complete:
    success_finish:
      action: play
      bus: effects
      max_queue_time: 1s
  tencallout1:
    ten_callout1:
      action: play
      bus: voice
      max_queue_time: 1s
  tencallout2:
    ten_callout2:
      action: play
      bus: voice
      max_queue_time: 1s
  tencallout3:
    ten_callout3:
      action: play
      bus: voice
      max_queue_time: 1s


random_event_player:
  timer_highplainsdrifter_time_remaining_tick{current_player.highplainsdrifter_time_remaining_variable_times_1==10}:
    events:
      - tencallout1
      - tencallout2
      - tencallout3


ball_holds:
  highplainsdrifter_scoop_hold:
    balls_to_hold: 1
    hold_devices: bd_scoop
    enable_events: mode_highplainsdrifter_started
    disable_events: timer_highplainsdrifter_intro_show_complete
    release_one_events: timer_highplainsdrifter_intro_show_complete


timers:
  highplainsdrifter_intro_show:
    start_value: 0
    end_value: 7
    control_events:
      - action: start
        event: mode_highplainsdrifter_started
      - action: jump
        value: 7
        event: flipper_cancel{device.ball_holds.highplainsdrifter_scoop_hold.balls_held==1}
  highplainsdrifter_time_remaining:
    start_value: 60
    end_value: 0
    direction: down
    control_events:
      - action: start
        event: timer_highplainsdrifter_intro_show_complete
      - action: pause
        event: highplainsdrifter_shots_counter_complete
      - action: reset
        event: mode_highplainsdrifter_started
      - action: add
        value: 5
        event: add_highplainsdrifter_time_5s
      - action: add
        value: 7
        event: add_highplainsdrifter_time_7s


event_player:
  timer_highplainsdrifter_time_remaining_complete: mode_highplainsdrifter_failed
  highplainsdrifter_shots_counter_complete: mode_highplainsdrifter_success
  pop_standup_hit: add_highplainsdrifter_time_7s
  highplainsdrifter_second_shot_hit: add_highplainsdrifter_time_5s


shot_profiles:
  highplainsdrifter_shot:
    advance_on_hit: False
    states:
      - name: "off"
    loop: False


blinkenlight_player:
  timer_highplainsdrifter_intro_show_complete:
    bl_leftorbit_arrow_led:
      color: EE82EE #violet
    bl_leftramp_arrow_led:
      color: EE82EE #violet
    bl_innerloop_arrow_led:
      color: EE82EE #violet
    bl_rightramp_arrow_led:
      color: EE82EE #violet
    bl_rightorbit_arrow_led:
      color: EE82EE #violet
  highplainsdrifter_left_orbit_1_done:
    bl_leftramp_arrow_led: remove
    bl_innerloop_arrow_led: remove
    bl_rightramp_arrow_led: remove
    bl_rightorbit_arrow_led: remove
    bl_leftorbit_arrow_led:
      color: FF69B4 #hotpink
  highplainsdrifter_left_ramp_1_done:
    bl_leftorbit_arrow_led: remove
    bl_innerloop_arrow_led: remove
    bl_rightramp_arrow_led: remove
    bl_rightorbit_arrow_led: remove
    bl_leftramp_arrow_led:
      color: FF69B4 #hotpink
  highplainsdrifter_inner_loop_1_done:
    bl_leftramp_arrow_led: remove
    bl_leftorbit_arrow_led: remove
    bl_rightramp_arrow_led: remove
    bl_rightorbit_arrow_led: remove
    bl_innerloop_arrow_led:
      color: FF69B4 #hotpink
  highplainsdrifter_right_ramp_1_done:
    bl_leftramp_arrow_led: remove
    bl_innerloop_arrow_led: remove
    bl_leftorbit_arrow_led: remove
    bl_rightorbit_arrow_led: remove
    bl_rightramp_arrow_led:
      color: FF69B4 #hotpink
  highplainsdrifter_right_orbit_1_done:
    bl_leftramp_arrow_led: remove
    bl_innerloop_arrow_led: remove
    bl_rightramp_arrow_led: remove
    bl_leftorbit_arrow_led: remove
    bl_rightorbit_arrow_led:
      color: FF69B4 #hotpink
  highplainsdrifter_second_shot_hit{device.counters.highplainsdrifter_shots_counter!=0}:
    bl_leftorbit_arrow_led:
      color: EE82EE #violet
    bl_leftramp_arrow_led:
      color: EE82EE #violet
    bl_innerloop_arrow_led:
      color: EE82EE #violet
    bl_rightramp_arrow_led:
      color: EE82EE #violet
    bl_rightorbit_arrow_led:
      color: EE82EE #violet

