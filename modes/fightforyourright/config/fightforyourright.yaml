#config_version=6

mode:
  start_events: mode_ffyr_ball_save_end_mode_stopped, start_fightforyourright
  stop_events: mode_fightforyourright_stop, fightforyourright_finish
  priority: 5001



sequences:
  fightforyourright_shot_1:
    events:
      - left_orbit_hit, right_orbit_hit
    events_when_complete: fightforyourright_shot_1_done
    reset_on_complete: False
    restart_events: slide_fightforyourright_instructions_removed
    start_enabled: False
  fightforyourright_shot_2:
    events:
      - left_ramp_hit, right_ramp_hit
    enable_events: fightforyourright_shot_1_done
    events_when_complete: fightforyourright_shot_2_done
    reset_on_complete: False
    start_enabled: False
  fightforyourright_shot_3:
    events:
      - captive_ball_hit, inner_loop_hit
    enable_events: fightforyourright_shot_2_done
    events_when_complete: fightforyourright_shot_3_done
    reset_on_complete: False
    start_enabled: False
  fightforyourright_shot_4:
    events:
      - right_orbit_hit, left_orbit_hit
    enable_events: fightforyourright_shot_3_done
    events_when_complete: fightforyourright_shot_4_done
    reset_on_complete: False
    start_enabled: False
  fightforyourright_shot_5:
    events:
      - right_ramp_hit, left_ramp_hit
    enable_events: fightforyourright_shot_4_done
    events_when_complete: fightforyourright_shot_5_done
    reset_on_complete: False
    start_enabled: False
  fightforyourright_shot_6:
    events:
      - captive_ball_hit, inner_loop_hit
    enable_events: fightforyourright_shot_5_done
    events_when_complete: fightforyourright_shot_6_done
    reset_on_complete: False
    start_enabled: False
  fightforyourright_final_shot:
    events:
      - scoop_hit
    enable_events: fightforyourright_shot_6_done
    events_when_complete: fightforyourright_final_shot_done
    reset_on_complete: False
    start_enabled: False


