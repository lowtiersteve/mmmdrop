event_player:
  brassmonkey_phase1_complete: brassmonkey_phase_complete1
  brassmonkey_phase2_complete: brassmonkey_phase_complete2
  brassmonkey_phase3_complete: brassmonkey_phase_complete3
  brassmonkey_phase4_complete: brassmonkey_phase_complete4
  brassmonkey_phase5_complete: brassmonkey_phase_complete5
  s_right_orbit_active{device.sequences.brassmonkey_upper_loop.enabled==True and device.sequences.brassmonkey_right_orbit.enabled==False and device.diverters.up_post.active==False}: uppost_up
  s_right_orbit_active{device.sequences.brassmonkey_captive_ball.enabled==True and device.sequences.brassmonkey_right_orbit.enabled==False and device.diverters.up_post.active==False}: uppost_up
  s_left_orbit_active{device.diverters.up_post.active==False and device.sequences.brassmonkey_scoop.enabled==True and device.sequences.brassmonkey_left_orbit.enabled==False}: uppost_up
  s_left_orbit_active{device.diverters.up_post.active==False and device.sequences.brassmonkey_final_shot.enabled==True}: uppost_up
  inner_loop_hit: uppost_down
  s_inner_orbit_active: uppost_down


