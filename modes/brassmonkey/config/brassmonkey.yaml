  brassmonkey_score_countdown_buffer:
    start_value: 0
    end_value: 2
    direction: up
    start_running: False
    tick_interval: 1s
    control_events:
      - action: start
        event: slide_brassmonkey_instructions_removed
      - action: pause
        event: ball_will_end
      - action: pause
        event: mode_brassmonkey_will_end
      - action: pause
        event: brassmonkey_shot_hit
      - action: restart
        event: brassmonkey_phase1_complete
      - action: restart
        event: brassmonkey_phase2_complete
      - action: restart
        event: brassmonkey_phase3_complete
      - action: restart
        event: brassmonkey_phase4_complete
      - action: restart
        event: brassmonkey_phase5_complete
  brassmonkey_score_countdown:
    start_value: 100
    end_value: 10
    direction: down
    start_running: False
    tick_interval: 200ms
    control_events:
      - action: pause
        event: ball_will_end
      - action: pause
        event: mode_brassmonkey_will_end
      - action: pause
        event: brassmonkey_shot_hit
      - action: reset
        event: brassmonkey_phase1_complete
      - action: reset
        event: brassmonkey_phase2_complete
      - action: reset
        event: brassmonkey_phase3_complete
      - action: reset
        event: brassmonkey_phase4_complete
      - action: reset
        event: brassmonkey_phase5_complete
      - action: jump
        value: 100
        event: brassmonkey_phase1_complete
      - action: jump
        value: 100
        event: brassmonkey_phase2_complete
      - action: jump
        value: 100
        event: brassmonkey_phase3_complete
      - action: jump
        value: 100
        event: brassmonkey_phase4_complete
      - action: jump
        value: 100
        event: brassmonkey_phase5_complete
      - action: restart
        event: timer_brassmonkey_score_countdown_buffer_complete


