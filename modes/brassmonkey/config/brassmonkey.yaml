sequences:
  brassmonkey_left_ramp:
    events:
      - left_ramp_hit
    events_when_complete: brassmonkey_shot_hit, brassmonkey_left_ramp_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_left_ramp
    restart_events: brassmonkey_enable_left_ramp
    disable_on_complete: True
    start_enabled: False
  brassmonkey_left_orbit:
    events:
      - left_orbit_hit
    events_when_complete: brassmonkey_shot_hit, brassmonkey_left_orbit_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_left_orbit
    restart_events: brassmonkey_enable_left_orbit
    disable_on_complete: True
    start_enabled: False
  brassmonkey_right_ramp:
    events:
      - right_ramp_hit
    events_when_complete: brassmonkey_shot_hit, brassmonkey_right_ramp_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_right_ramp
    restart_events: brassmonkey_enable_right_ramp
    disable_on_complete: True
    start_enabled: False
  brassmonkey_right_orbit:
    events:
      - right_orbit_hit
    events_when_complete: brassmonkey_shot_hit, brassmonkey_right_orbit_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_right_orbit
    restart_events: brassmonkey_enable_right_orbit
    disable_on_complete: True
    start_enabled: False
  brassmonkey_upper_loop:
    events:
      - inner_loop_hit
    events_when_complete: brassmonkey_shot_hit, brassmonkey_upper_loop_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_upper_loop
    restart_events: brassmonkey_enable_upper_loop
    disable_on_complete: True
    start_enabled: False
  brassmonkey_lower_pop_standup:
    events:
      - pop_standup_hit
    events_when_complete: brassmonkey_shot_hit, brassmonkey_lower_pop_standup_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_lower_pop_standup
    restart_events: brassmonkey_enable_lower_pop_standup
    disable_on_complete: True
    start_enabled: False
  brassmonkey_upper_pop_standup:
    events:
      - upper_pop_standup_hit
    events_when_complete: brassmonkey_shot_hit, brassmonkey_upper_pop_standup_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_upper_pop_standup
    restart_events: brassmonkey_enable_upper_pop_standup
    disable_on_complete: True
    start_enabled: False
  brassmonkey_scoop:
    events:
      - scoop_hit
    events_when_complete: brassmonkey_shot_hit, brassmonkey_scoop_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_scoop
    restart_events: brassmonkey_enable_scoop
    disable_on_complete: True
    start_enabled: False
  brassmonkey_captive_ball:
    events:
      - captive_ball_hit
    events_when_complete: brassmonkey_shot_hit, brassmonkey_captive_ball_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_captive_ball
    restart_events: brassmonkey_enable_captive_ball
    disable_on_complete: True
    start_enabled: False
  brassmonkey_upper_left_pop:
    events:
      - pop1_hit
    events_when_complete: brassmonkey_shot_hit, brassmonkey_upper_left_pop_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_upper_left_pop
    restart_events: brassmonkey_enable_upper_left_pop
    disable_on_complete: True
    start_enabled: False
  brassmonkey_upper_right_pop:
    events:
      - pop2_hit
    events_when_complete: brassmonkey_shot_hit, brassmonkey_upper_right_pop_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_upper_right_pop
    restart_events: brassmonkey_enable_upper_right_pop
    disable_on_complete: True
    start_enabled: False
  brassmonkey_lower_pop:
    events:
      - pop3_hit
    events_when_complete: brassmonkey_shot_hit, brassmonkey_lower_pop_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_lower_pop
    restart_events: brassmonkey_enable_lower_pop
    disable_on_complete: True
    start_enabled: False
  brassmonkey_drops:
    events:
      - drop_target_bottom_down, drop_target_middle_down, drop_target_top_down
    events_when_complete: brassmonkey_shot_hit, brassmonkey_drops_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_drops
    restart_events: brassmonkey_enable_drops
    disable_on_complete: True
    start_enabled: False
  brassmonkey_tshirts:
    events:
      - tshirt_top_hit, tshirt_bottom_hit, sg_tshirts_hit, machine_var_audits_switches_s_tshirt_top_standup, machine_var_audits_switches_s_tshirt_bottom_standup
    events_when_complete: brassmonkey_shot_hit, brassmonkey_tshirts_hit
    reset_on_complete: False
    enable_events: brassmonkey_enable_tshirts
    restart_events: brassmonkey_enable_tshirts
    disable_on_complete: True
    start_enabled: False
  brassmonkey_phase_1:
    events:
      - brassmonkey_left_ramp_hit, brassmonkey_left_orbit_hit, brassmonkey_right_ramp_hit, brassmonkey_right_orbit_hit, brassmonkey_upper_loop_hit, brassmonkey_lower_pop_standup_hit, brassmonkey_upper_pop_standup_hit, brassmonkey_scoop_hit, brassmonkey_captive_ball_hit, brassmonkey_upper_left_pop_hit, brassmonkey_upper_right_pop_hit, brassmonkey_lower_pop_hit, brassmonkey_drops_hit, brassmonkey_tshirts_hit
    events_when_complete: brassmonkey_phase1_complete
    reset_on_complete: False
    enable_events: slide_brassmonkey_instructions_removed
    disable_on_complete: True
  brassmonkey_phase_2:
    events:
      - brassmonkey_left_ramp_hit, brassmonkey_left_orbit_hit, brassmonkey_right_ramp_hit, brassmonkey_right_orbit_hit, brassmonkey_upper_loop_hit, brassmonkey_lower_pop_standup_hit, brassmonkey_upper_pop_standup_hit, brassmonkey_scoop_hit, brassmonkey_captive_ball_hit, brassmonkey_upper_left_pop_hit, brassmonkey_upper_right_pop_hit, brassmonkey_lower_pop_hit, brassmonkey_drops_hit, brassmonkey_tshirts_hit
    events_when_complete: brassmonkey_phase2_complete
    reset_on_complete: False
    enable_events: brassmonkey_phase1_complete
    disable_on_complete: True
  brassmonkey_phase_3:
    events:
      - brassmonkey_left_ramp_hit, brassmonkey_left_orbit_hit, brassmonkey_right_ramp_hit, brassmonkey_right_orbit_hit, brassmonkey_upper_loop_hit, brassmonkey_lower_pop_standup_hit, brassmonkey_upper_pop_standup_hit, brassmonkey_scoop_hit, brassmonkey_captive_ball_hit, brassmonkey_upper_left_pop_hit, brassmonkey_upper_right_pop_hit, brassmonkey_lower_pop_hit, brassmonkey_drops_hit, brassmonkey_tshirts_hit
    events_when_complete: brassmonkey_phase3_complete
    reset_on_complete: False
    enable_events: brassmonkey_phase2_complete
    disable_on_complete: True
  brassmonkey_phase_4:
    events:
      - brassmonkey_left_ramp_hit, brassmonkey_left_orbit_hit, brassmonkey_right_ramp_hit, brassmonkey_right_orbit_hit, brassmonkey_upper_loop_hit, brassmonkey_lower_pop_standup_hit, brassmonkey_upper_pop_standup_hit, brassmonkey_scoop_hit, brassmonkey_captive_ball_hit, brassmonkey_upper_left_pop_hit, brassmonkey_upper_right_pop_hit, brassmonkey_lower_pop_hit, brassmonkey_drops_hit, brassmonkey_tshirts_hit
    events_when_complete: brassmonkey_phase4_complete
    reset_on_complete: False
    enable_events: brassmonkey_phase3_complete
    disable_on_complete: True
  brassmonkey_phase_5:
    events:
      - brassmonkey_left_ramp_hit, brassmonkey_left_orbit_hit, brassmonkey_right_ramp_hit, brassmonkey_right_orbit_hit, brassmonkey_upper_loop_hit, brassmonkey_lower_pop_standup_hit, brassmonkey_upper_pop_standup_hit, brassmonkey_scoop_hit, brassmonkey_captive_ball_hit, brassmonkey_upper_left_pop_hit, brassmonkey_upper_right_pop_hit, brassmonkey_lower_pop_hit, brassmonkey_drops_hit, brassmonkey_tshirts_hit
    events_when_complete: brassmonkey_phase5_complete
    reset_on_complete: False
    enable_events: brassmonkey_phase4_complete
    disable_on_complete: True
  brassmonkey_final_shot:
    events:
      - scoop_hit
    events_when_complete: brassmonkey_finish
    reset_on_complete: False
    enable_events: brassmonkey_phase5_complete
    disable_on_complete: True



variable_player:
  mode_brassmonkey_started:
    mode_blocking_flag:
      int: 1
      action: set
    wizard_blocking_flag:
      int: 1
      action: set
    active_mode:
      string: "Brass Monkey"
      action: set
    active_mode_objective:
      string: "Shoot Red Blinking Shots and Targets"
      action: set
    mode_brassmonkey_score:
      int: 0
      action: set
    modes_played: 1
    battery_charged_yesorno:
      int: 0
      action: set
    brassmonkey_phase:
      int: 1
      action: set
  timer_brassmonkey_score_countdown_tick:
    brassmonkey_score_countdown_value:
      int: device.timers.brassmonkey_score_countdown.ticks * 100000
      action: set
  timer_brassmonkey_score_countdown_buffer_started:
    brassmonkey_score_countdown_value:
      int: 10000000
      action: set
  brassmonkey_shot_hit:
    score: current_player.brassmonkey_score_countdown_value * current_player.playfield_x * current_player.brassmonkey_mode_multiplier
    mode_brassmonkey_score: current_player.brassmonkey_score_countdown_value * current_player.playfield_x * current_player.brassmonkey_mode_multiplier
  brassmonkey_finish:
    score: current_player.brassmonkey_score_countdown_value * current_player.playfield_x * current_player.brassmonkey_mode_multiplier
    mode_brassmonkey_score: current_player.brassmonkey_score_countdown_value * current_player.playfield_x * current_player.brassmonkey_mode_multiplier
  brassmonkey_phase1_complete:
    brassmonkey_phase:
      int: 1
      action: add
  brassmonkey_phase2_complete:
    brassmonkey_phase:
      int: 1
      action: add
  brassmonkey_phase3_complete:
    brassmonkey_phase:
      int: 1
      action: add
  brassmonkey_phase4_complete:
