sequences:
  qualify_chcheckitout_multiball:
    events:
      - chcheckitout_multiball_qualified
    events_when_complete: drops_standup_start_multiball
    reset_on_complete: true
    disable_on_complete: false
    reset_events: ball_started
  chcheckitout_multiball_ready:
    events:
      - three_bank_standup_hit{current_player.bodymovin_multiball_blocking_flag==0}
    enable_events: drops_standup_start_multiball
    events_when_complete: chcheckitout_start_multiball
    reset_on_complete: true
    disable_on_complete: false
    reset_events: ball_started
  enable_bodymovin_lock_1:
    events:
      - lock_standups_complete{current_player.chcheckitout_multiball_blocking_flag==0}
    events_when_complete: bodymovin_lock_1_enabled
    reset_on_complete: false
    start_enabled: false
    disable_on_complete: true
    persist_state: true
    restart_events: multiball_bodymovin_ended, ball_started{current_player.ball==1}
  bodymovin_lock_1:
    events:
      - scoop_hit{current_player.chcheckitout_multiball_blocking_flag==0}
    events_when_complete: bodymovin_ball_1_locked
    reset_on_complete: false
    start_enabled: false
    disable_on_complete: true
    persist_state: true
    restart_events: bodymovin_lock_1_enabled
  enable_bodymovin_lock_2:
    events:
      - lock_standups_complete{current_player.chcheckitout_multiball_blocking_flag==0}
    events_when_complete: bodymovin_lock_2_enabled
    reset_on_complete: false
    start_enabled: false
    disable_on_complete: true
    persist_state: true
    restart_events: bodymovin_ball_1_locked
  bodymovin_lock_2:
    events:
      - scoop_hit{current_player.chcheckitout_multiball_blocking_flag==0}
    events_when_complete: bodymovin_ball_2_locked
    reset_on_complete: false
    start_enabled: false
    disable_on_complete: true
    persist_state: true
    restart_events: bodymovin_lock_2_enabled
  enable_bodymovin_lock_3:
    events:
      - lock_standups_complete{current_player.chcheckitout_multiball_blocking_flag==0}
    events_when_complete: bodymovin_lock_3_enabled
    reset_on_complete: false
    start_enabled: false
    disable_on_complete: true
    persist_state: true
    restart_events: bodymovin_ball_2_locked
  bodymovin_multiball_ready:
    events:
      - scoop_hit{current_player.chcheckitout_multiball_blocking_flag==0}
    enable_events: bodymovin_lock_3_enabled
    events_when_complete: bodymovin_start_multiball
    reset_on_complete: true
    disable_on_complete: true
    persist_state: true
    restart_events: bodymovin_lock_3_enabled

counters:
  drop_target_bank_counter:
    count_events: drop_target_bank_three_bank_down{current_player.bodymovin_multiball_blocking_flag==0}
    events_when_complete: chcheckitout_multiball_qualified
    starting_count: 0
    count_complete_value: 1
    count_interval: 1
    direction: up
    persist_state: false
    disable_on_complete: false
    reset_on_complete: false
    disable_events: multiball_chcheckitout_started, mode_makesomenoise_started, multiball_bodymovin_started
    enable_events: ball_started, mode_makesomenoise_stopped, multiball_bodymovin_ended
    restart_events: multiball_chcheckitout_ended
    control_events:
      - event: reset_drop_target_bank_counter
        action: jump
        value: 0
  completed_modes_count:
    count_events: mode_intergalactic_success, mode_paulrevere_success, mode_tripletrouble_success, mode_sabotage_success
    starting_count: 0
    count_complete_value: 9
    count_interval: 1
    direction: up
    persist_state: true
    disable_on_complete: true
    reset_on_complete: false
  played_modes_count:
    count_events: mode_intergalactic_started, mode_paulrevere_started, mode_tripletrouble_started, mode_sabotage_started, mode_makesomenoise_started
    starting_count: 0
