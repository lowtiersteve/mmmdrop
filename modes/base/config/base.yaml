#config_version=6
mode:
  start_events: ball_starting
  priority: 100

counters:
  drop_target_counter:
    count_events: drop_target_top_hit, drop_target_middle_hit, drop_target_bottom_hit
    multiple_hit_window: 500ms
    events_when_hit: drop_target_counter_hit

slide_player:
  mode_base_started:
    base:
      action: play
      priority: 100000
    score_overlay:
      action: play
      priority: 900000

sound_player:
  mode_base_started:
    base_game_random_music:
      bus: music
      loops: 14
  drop_target_counter_hit:
    drop_sound_random:
      bus: effects
      max_queue_time: 1s


