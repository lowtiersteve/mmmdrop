#config_version=6
mode:
  start_events: ball_starting
  priority: 100

sequence_shots:
  left_orbit_sequence:
    switch_sequence: s_left_orbit, s_right_orbit
    sequence_timeout: 3s
  right_orbit_sequence:
    switch_sequence: s_right_orbit, s_left_orbit
    sequence_timeout: 3s
  inner_loop_sequence:
    switch_sequence: s_inner_orbit, s_right_orbit
    sequence_timeout: 2s
  inner_loop_backdoor_sequence:
    switch_sequence: s_inner_orbit, s_scoop
    sequence_timeout: 3s
  left_orbit_backdoor_sequence:
    switch_sequence: s_left_orbit, s_scoop
    sequence_timeout: 3s
  right_orbit_backdoor_sequence:
    switch_sequence: s_right_orbit, s_scoop
    sequence_timeout: 3s


shots:
  left_orbit:
    hit_events: left_orbit_sequence_hit
    profile: base_shot_profile
  right_orbit:
    hit_events: right_orbit_sequence_hit
    profile: base_shot_profile
  inner_loop:
    hit_events: inner_loop_sequence_hit
    profile: base_shot_profile
  left_orbit_backdoor:
    hit_events: left_orbit_backdoor_sequence_hit
    profile: base_shot_profile
  right_orbit_backdoor:
    hit_events: right_orbit_backdoor_sequence_hit
    profile: base_shot_profile
  inner_loop_backdoor:
    hit_events: inner_loop_backdoor_sequence_hit
    profile: base_shot_profile
  right_ramp:
    switch: s_right_ramp
    profile: base_shot_profile
  left_ramp:
    switch: s_left_ramp
    profile: base_shot_profile
  pop_standup:
    switch: s_pop_standup
    profile: base_shot_profile
  upper_pop_standup:
    switch: s_upper_pop_standup
    profile: base_shot_profile
  scoop:
    switch: s_scoop
    profile: base_shot_profile
  captive_ball:
    switch: s_captive_ball
    profile: base_shot_profile
  three_bank_standup:
    switch: s_three_bank_standup
    show_tokens:
      led: l_dropstandup_flasher_led
      color: green
    profile: ball_lock_profile
    advance_events: logicblock_qualify_chcheckitout_multiball_hit, multiball_chcheckitout_started
  spinner:
    switch: s_spinner
    profile: base_shot_profile
  pop1:
    switch: s_left_upper_pop
    profile: base_shot_profile
  pop2:
    switch: s_center_upper_pop
    profile: base_shot_profile
  pop3:
    switch: s_right_lower_pop
    profile: base_shot_profile
  bottom_drop:
    switch: s_three_bank_bottom
    show_tokens:
      led: l_lowerdrop_circle_led
      color: SkyBlue
    profile: base_shot_profile
  middle_drop:
    switch: s_three_bank_middle
    show_tokens:
      led: l_middledrop_circle_led
      color: SkyBlue
    profile: base_shot_profile
  top_drop:
    switch: s_three_bank_top
    show_tokens:
      led: l_upperdrop_circle_led
      color: SkyBlue
    profile: base_shot_profile
  tshirt_top_standup:
    switch: s_tshirt_top_standup
    show_tokens:
      led: l_tshirttopcircle_led
      color: green
    profile: ball_lock_profile
  tshirt_bottom_standup:
    switch: s_tshirt_bottom_standup
    show_tokens:
      led: l_tshirtbottomcircle_led
      color: green
    profile: ball_lock_profile
  left_outlane:
    switch: s_left_outlane
    show_tokens:
      led: l_leftoutlane_circle_led
      color: Silver
    profile: lane_profile
  left_inlane:
    switch: s_left_inlane
    show_tokens:
      led: l_leftinlane_circle_led
      color: Silver
    profile: lane_profile
  right_inlane:
    switch: s_right_inlane
    show_tokens:
      led: l_rightinlane_circle_led
      color: Silver
    profile: lane_profile
  right_outlane:
    switch: s_right_outlane
    show_tokens:
      led: l_rightoutlane_circle_led
      color: Silver
    profile: lane_profile


shot_profiles:
  base_shot_profile:
    advance_on_hit: false
    states:
      - name: off
        show: "off"
    loop: false
  ball_lock_profile:
    advance_on_hit: true
    states:
      - name: "flash"
        show: "flash_color"
      - name: "on"
        show: "led_color"
    loop: false
  lane_profile:
    states:
      - name: unlit
        show: "off"
      - name: lit
        show: "lane_lit"


shot_groups:
  sg_lanes:
    shots: left_outlane, left_inlane, right_inlane, right_outlane
    rotate_left_events: s_left_flipper_active
    rotate_right_events: s_right_flipper_active
    reset_events:
      sg_lanes_lit_complete: 1s
  sg_tshirts:
    shots: tshirt_top_standup, tshirt_bottom_standup
    restart_events: bodymovin_ball_1_locked, bodymovin_ball_2_locked, multiball_bodymovin_ended, ball_started{current_player.ball==1}
    disable_events: bodymovin_lock_1_enabled, bodymovin_lock_2_enabled, bodymovin_lock_3_enabled


slide_player:
