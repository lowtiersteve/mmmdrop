sequences:
  qualify_chcheckitout_multiball:
    events:
      - chcheckitout_multiball_qualified
    events_when_complete: drops_standup_start_multiball
    reset_on_complete: true #this could be a problem if multiballs are immediately lighting again too fast
    disable_on_complete: false
    reset_events: ball_started
  chcheckitout_multiball_ready:
    events:
      - three_bank_standup_hit
    enable_events: drops_standup_start_multiball
    events_when_complete: chcheckitout_start_multiball
    reset_on_complete: true
    disable_on_complete: false
    reset_events: ball_started

counters:
  drop_target_bank_counter:
    count_events: drop_target_bank_three_bank_down
    events_when_complete: chcheckitout_multiball_qualified
    starting_count: 0
    count_complete_value: 1
    count_interval: 1
    direction: up
    persist_state: false
    disable_on_complete: false
    reset_on_complete: false
    disable_events: multiball_chcheckitout_started, mode_makesomenoise_started
    enable_events: ball_started, mode_makesomenoise_stopped
    restart_events: multiball_chcheckitout_ended
    control_events:
      - event: reset_drop_target_bank_counter
        action: jump
        value: 0

event_player:
  multiball_chcheckitout_ended: reset_drop_target_bank_counter


random_event_player:
  multiball_chcheckitout_started:
    events:
      - play_chcheckitout_video1
      - play_chcheckitout_video2
      - play_chcheckitout_video3
  slide_base_created:
    events:
      - play_base_video1
      - play_base_video2
      - play_base_video3
      - play_base_video4