#config_version=6

mode:
  start_events: battery_charged, multiball_chcheckitout_ended{current_player.mode_blocking_flag==0 and current_player.battery_charged_yesorno==1}, multiball_bodymovin_ended{current_player.mode_blocking_flag==0 and current_player.battery_charged_yesorno==1}, ball_started{current_player.ball!=1 and current_player.battery_charged_yesorno==1}
  stop_events: carousel_item_selected, chcheckitout_start_multiball, bodymovin_start_multiball, ball_will_end
  code: mpf.modes.carousel.code.carousel.Carousel
  priority: 200


mode_settings:
  selectable_items: intergalactic{not device.achievements.intergalactic_mode.state=='completed'}, paulrevere{not device.achievements.paulrevere_mode.state=='completed'}, tripletrouble{not device.achievements.tripletrouble_mode.state=='completed'}, sabotage{not device.achievements.sabotage_mode.state=='completed'}, fingerlickingood{not device.achievements.fingerlickingood_mode.state=='completed'}
  select_item_events: scoop_hit
  next_item_events: pop1_hit, pop2_hit, carousel_advance, carousel_advance_2, carousel_advance_3, carousel_advance_4
  previous_item_events: pop3_hit


variable_player:
  carousel_intergalactic_selected:
    selected_mode:
      string: "Intergalactic"
      action: set
  carousel_paulrevere_selected:
    selected_mode:
      string: "Paul Revere"
      action: set
  carousel_tripletrouble_selected:
    selected_mode:
      string: "Triple Trouble"
      action: set
  carousel_sabotage_selected:
    selected_mode:
      string: "Sabotage"
      action: set
  carousel_fingerlickingood_selected:
    selected_mode:
      string: "Finger Lickin Good"
      action: set



slide_player:
  mode_carousel_started:
    current_mode_highlighted:
      action: play
      priority: 500000


event_player:
  select_intergalactic: mode_intergalactic_start
  select_paulrevere: mode_paulrevere_start
  select_tripletrouble: mode_tripletrouble_start
  select_sabotage: mode_sabotage_start
  select_fingerlickingood: mode_fingerlickingood_start
  achievement_wizard1_state_enabled: stop_carousel
  random_mode_picker_paulrevere: carousel_advance
  random_mode_picker_tripletrouble: carousel_advance, carousel_advance_2
  random_mode_picker_sabotage: carousel_advance, carousel_advance_2, carousel_advance_3
  random_mode_picker_fingerlickingood: carousel_advance, carousel_advance_2, carousel_advance_3, carousel_advance_4


random_event_player:
  slide_current_mode_highlighted_created:
    events:
    - random_mode_picker_intergalactic
    - random_mode_picker_paulrevere
    - random_mode_picker_tripletrouble
    - random_mode_picker_sabotage
    - random_mode_picker_fingerlickingood


show_player:
  item_highlighted{item=='intergalactic'}:
    intergalactic_mode_lit:
      action: play
      loops: -1
  item_highlighted{item!='intergalactic'}:
    intergalactic_mode_lit:
      action: stop
  item_highlighted{item=='paulrevere'}:
    paulrevere_mode_lit:
      action: play
      loops: -1
  item_highlighted{item!='paulrevere'}:
    paulrevere_mode_lit:
      action: stop
  item_highlighted{item=='tripletrouble'}:
    tripletrouble_mode_lit:
      action: play
      loops: -1
  item_highlighted{item!='tripletrouble'}:
    tripletrouble_mode_lit:
      action: stop
  item_highlighted{item=='sabotage'}:
    sabotage_mode_lit:
      action: play
      loops: -1
  item_highlighted{item!='sabotage'}:
    sabotage_mode_lit:
      action: stop
  item_highlighted{item=='fingerlickingood'}:
    fingerlickingood_mode_lit:
      action: play
      loops: -1
  item_highlighted{item!='fingerlickingood'}:
    fingerlickingood_mode_lit:
      action: stop


