#config_version=6

mode:
  start_events: battery_charged, multiball_chcheckitout_ended{current_player.mode_blocking_flag==0 and current_player.battery_charged_yesorno==1}, multiball_bodymovin_ended{current_player.mode_blocking_flag==0 and current_player.battery_charged_yesorno==1}, ball_started{current_player.ball!=1 and current_player.battery_charged_yesorno==1}
  stop_events: carousel_item_selected, chcheckitout_start_multiball, bodymovin_start_multiball, ball_will_end, stop_carousel
  code: mpf.modes.carousel.code.carousel.Carousel
  priority: 200


mode_settings:
  selectable_items: intergalactic{not device.achievements.intergalactic_mode.state=='completed'}, paulrevere{not device.achievements.paulrevere_mode.state=='completed'}, tripletrouble{not device.achievements.tripletrouble_mode.state=='completed'}, sabotage{not device.achievements.sabotage_mode.state=='completed'}
  select_item_events: scoop_hit
  next_item_events: s_left_upper_pop_active, s_center_upper_pop_active
  previous_item_events: s_right_lower_pop_active


variable_player:
  carousel_intergalactic_selected:
    selected_mode:
      string: "Intergalactic"
      action: set
  carousel_paulrevere_selected:
    selected_mode:
      string: "Paul Revere"
      action: set
  carousel_tripletrouble_selected:
    selected_mode:
      string: "Triple Trouble"
      action: set
  carousel_sabotage_selected:
    selected_mode:
      string: "Sabotage"
      action: set


slide_player:
  mode_carousel_started:
    current_mode_highlighted:
      action: play
      priority: 500000


event_player:
  select_intergalactic: mode_intergalactic_start
  select_paulrevere: mode_paulrevere_start
  select_tripletrouble: mode_tripletrouble_start
  select_sabotage: mode_sabotage_start
  achievement_wizard1_state_enabled: stop_carousel


show_player:
  item_highlighted{item=='intergalactic'}:
    intergalactic_mode_lit:
      action: play
      loops: -1
  item_highlighted{item!='intergalactic'}:
    intergalactic_mode_lit:
      action: stop
  item_highlighted{item=='paulrevere'}:
    paulrevere_mode_lit:
      action: play
      loops: -1
  item_highlighted{item!='paulrevere'}:
    paulrevere_mode_lit:
      action: stop
  item_highlighted{item=='tripletrouble'}:
    tripletrouble_mode_lit:
      action: play
      loops: -1
  item_highlighted{item!='tripletrouble'}:
    tripletrouble_mode_lit:
      action: stop
  item_highlighted{item=='sabotage'}:
    sabotage_mode_lit:
      action: play
      loops: -1
  item_highlighted{item!='sabotage'}:
    sabotage_mode_lit:
      action: stop

