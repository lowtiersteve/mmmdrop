        action: jump
        value: 0
      - event: mode_intergalactic_stopped{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_intergalactic_stopped{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_intergalactic_success{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_intergalactic_success{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_paulrevere_stopped{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
