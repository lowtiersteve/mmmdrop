        action: jump
        value: 20
      - event: mode_paulrevere_success{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_paulrevere_success{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_tripletrouble_stopped{not device.achievements.wizard1.state=="completed"}
