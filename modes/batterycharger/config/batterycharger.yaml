#config_version=6

mode:
  start_events: ball_starting
  stop_events: ball_will_end
  priority: 100


counters:
  battery_charged_status:
    count_events: spinner_hit{current_player.bodymovin_multiball_blocking_flag==0 and current_player.chcheckitout_multiball_blocking_flag==0 and current_player.mode_blocking_flag==0 and current_player.girls_blocking_flag==0 and device.achievements.wizard1.state!="enabled"}
    events_when_complete: battery_charged
    starting_count: 20
    count_complete_value: 0
    count_interval: 1
    direction: down
    persist_state: True
    disable_on_complete: True
    reset_on_complete: False
    disable_events: multiball_chcheckitout_started, mode_makesomenoise_started, multiball_bodymovin_started, mode_girls_started, ball_is_ending
    enable_events: ball_started, multiball_chcheckitout_ended, multiball_bodymovin_ended, multiball_makesomenoise_ended, mode_girls_stopped
    restart_events: mode_intergalactic_stopped, mode_intergalactic_success, mode_paulrevere_stopped, mode_paulrevere_success, mode_tripletrouble_stopped, mode_tripletrouble_success, mode_sabotage_stopped, mode_sabotage_success, mode_fingerlickingood_stopped, mode_fingerlickingood_success, mode_toomanyrappers_stopped, mode_toomanyrappers_success, mode_threemcsand1dj_stopped, mode_threemcsand1dj_success, mode_highplainsdrifter_stopped, mode_highplainsdrifter_success
    control_events:
      - event: mode_batterycharger_started{current_player.ball==1}
        action: jump
        value: 0
      - event: mode_intergalactic_stopped{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_intergalactic_stopped{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_intergalactic_success{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_intergalactic_success{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_paulrevere_stopped{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_paulrevere_stopped{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_paulrevere_success{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_paulrevere_success{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_tripletrouble_stopped{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_tripletrouble_stopped{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_tripletrouble_success{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_tripletrouble_success{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_sabotage_stopped{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_sabotage_stopped{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_sabotage_success{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_sabotage_success{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_fingerlickingood_stopped{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_fingerlickingood_stopped{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_fingerlickingood_success{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_fingerlickingood_success{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_toomanyrappers_stopped{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_toomanyrappers_stopped{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_toomanyrappers_success{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_toomanyrappers_success{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_threemcsand1dj_stopped{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_threemcsand1dj_stopped{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_threemcsand1dj_success{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_threemcsand1dj_success{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_highplainsdrifter_stopped{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_highplainsdrifter_stopped{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: mode_highplainsdrifter_success{not device.achievements.wizard1.state=="completed"}
        action: jump
        value: 10
      - event: mode_highplainsdrifter_success{device.achievements.wizard1.state=="completed"}
        action: jump
        value: 20
      - event: multiball_makesomenoise_ended
        action: jump
        value: 20
      - event: scoop_hit{current_player.bodymovin_multiball_blocking_flag==0 and current_player.chcheckitout_multiball_blocking_flag==0 and current_player.mode_blocking_flag==0 and current_player.girls_blocking_flag==0 and device.achievements.wizard1.state!="enabled" and device.counters.battery_charged_status.value>0}
        action: add
        value: -5
      - event: logicblock_battery_charged_status_updated{device.counters.battery_charged_status.value<0}
        action: jump
        value: 0



