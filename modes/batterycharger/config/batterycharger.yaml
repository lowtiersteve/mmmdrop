    battery_red:
      action:
        stop
    battery_yellow:
      action: play
      loops: -1
  achievement_wizard1_state_enabled:
    battery_green:
      action: stop
    battery_yellow:
      action: stop
    battery_red:
      action: stop


variable_player:
  logicblock_battery_charged_status_updated:
    charges_remaining_variable:
      int: device.counters.battery_charged_status.value * 1
      action: set


widget_player:
  battery_charged:
    charges_remaining:
      action: remove
  logicblock_battery_charged_status_updated{device.counters.battery_charged_status.value>0 and device.achievements.wizard1.state!="enabled" and device.counters.battery_charged_status.enabled==True}:
    charges_remaining:
      action: play
      slide: score_overlay
      priority: 901000
  achievement_wizard1_state_enabled{device.achievements.wizard1.state=="enabled"}:
    charges_remaining:
      action: remove
  mode_makesomenoise_stopped:
    charges_remaining:
      action: play
      slide: score_overlay
      priority: 901000
  ball_started{current_player.ball!=1 and device.counters.battery_charged_status.value>0 and device.achievements.wizard1.state!="enabled" and device.counters.battery_charged_status.enabled==True and current_player.battery_charged_yesorno==0}:
    charges_remaining:
      action: play
      slide: score_overlay
      priority: 901000
  ball_will_end:
    charges_remaining:
      action: remove
  mode_fingerlickingood_started:
    charges_remaining:
      action: remove
  mode_highplainsdrifter_started:
    charges_remaining:
      action: remove
  mode_intergalactic_started:
    charges_remaining:
      action: remove
  mode_makesomenoise_started:
    charges_remaining:
      action: remove
  mode_paulrevere_started:
    charges_remaining:
      action: remove
  mode_sabotage_started:
    charges_remaining:
      action: remove
  mode_threemcsand1dj_started:
    charges_remaining:
      action: remove
  mode_toomanyrappers_started:
    charges_remaining:
      action: remove
  mode_tripletrouble_started:
    charges_remaining:
      action: remove



sound_player:
  batterychargercallout1:
    batterycharger_callout1:
      action: play
      bus: voice
  batterychargercallout2:
    batterycharger_callout2:
      action: play
      bus: voice


random_event_player:
  scoop_hit{device.counters.battery_charged_status.enabled==True and device.counters.battery_charged_status.value>0 and device.achievements.wizard1.state!="enabled" and device.counters.completed_modes_count.value!=2}:
    events:
      - batterychargercallout1
      - batterychargercallout2
