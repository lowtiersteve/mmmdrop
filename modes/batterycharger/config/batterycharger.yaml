    starting_count: 20
    count_complete_value: 0
    count_interval: 1
    direction: down
    persist_state: True
    disable_on_complete: True
    reset_on_complete: False
    disable_events: multiball_chcheckitout_started, mode_makesomenoise_started, mode_bodhivow_started, multiball_bodymovin_started, mode_girls_started, ball_is_ending, mode_sureshot_started
