#config_version=6

mode:
  start_events: brassmonkey_finish, start_nosleeptilbrooklyn
  stop_events: mode_nosleeptilbrooklyn_stop, nosleeptilbrooklyn_finish, ball_will_end
  priority: 5001


counters:
  nosleeptilbrooklyn_leftorbit_counter:
    count_events: left_orbit_hit
    events_when_complete: nosleeptilbrooklyn_leftorbit_counter_complete
    starting_count: 1
    count_complete_value: 4
    count_interval: 1
    direction: up
    persist_state: False
    disable_on_complete: True
    reset_on_complete: False
    disable_events: mode_nosleeptilbrooklyn_ended, mode_nosleeptilbrooklyn_stopped
    restart_events: mode_nosleeptilbrooklyn_started
  nosleeptilbrooklyn_leftramp_counter:
    count_events: left_ramp_hit
    events_when_complete: nosleeptilbrooklyn_leftramp_counter_complete
    starting_count: 1
    count_complete_value: 4
    count_interval: 1
    direction: up
    persist_state: False
    disable_on_complete: True
    reset_on_complete: False
    disable_events: mode_nosleeptilbrooklyn_ended, mode_nosleeptilbrooklyn_stopped
    restart_events: mode_nosleeptilbrooklyn_started
  nosleeptilbrooklyn_upper_loop_counter:
    count_events: inner_loop_hit
    events_when_complete: nosleeptilbrooklyn_upper_loop_counter_complete
    starting_count: 1
    count_complete_value: 4
    count_interval: 1
    direction: up
    persist_state: False
    disable_on_complete: True
    reset_on_complete: False
    disable_events: mode_nosleeptilbrooklyn_ended, mode_nosleeptilbrooklyn_stopped
    restart_events: mode_nosleeptilbrooklyn_started
  nosleeptilbrooklyn_rightorbit_counter:
    count_events: right_orbit_hit
    events_when_complete: nosleeptilbrooklyn_rightorbit_counter_complete
    starting_count: 1
    count_complete_value: 4
    count_interval: 1
    direction: up
    persist_state: False
    disable_on_complete: True
    reset_on_complete: False
    disable_events: mode_nosleeptilbrooklyn_ended, mode_nosleeptilbrooklyn_stopped
    restart_events: mode_nosleeptilbrooklyn_started
  nosleeptilbrooklyn_rightramp_counter:
    count_events: right_ramp_hit
    events_when_complete: nosleeptilbrooklyn_rightramp_counter_complete
    starting_count: 1
    count_complete_value: 4
    count_interval: 1
    direction: up
    persist_state: False
    disable_on_complete: True
    reset_on_complete: False
    disable_events: mode_nosleeptilbrooklyn_ended, mode_nosleeptilbrooklyn_stopped
    restart_events: mode_nosleeptilbrooklyn_started


accruals:
  nosleeptilbrooklyn_collect_shots:
    events:
      - nosleeptilbrooklyn_rightramp_counter_complete
      - nosleeptilbrooklyn_leftramp_counter_complete
      - nosleeptilbrooklyn_rightorbit_counter_complete
      - nosleeptilbrooklyn_leftorbit_counter_complete
      - nosleeptilbrooklyn_upper_loop_counter_complete
    events_when_complete: nosleeptilbrooklyn_enable_scoop
    reset_on_complete: False
    restart_events: slide_nosleeptilbrooklyn_instructions_removed
    enable_events: slide_nosleeptilbrooklyn_instructions_removed
    disable_on_complete: True

sequences:
  nosleeptilbrooklyn_final_shot:
    events:
      - scoop_hit
    events_when_complete: nosleeptilbrooklyn_finish
    reset_on_complete: False
    enable_events: nosleeptilbrooklyn_enable_scoop
    disable_on_complete: True


variable_player:
  mode_nosleeptilbrooklyn_started:
    mode_blocking_flag:
      int: 1
      action: set
    wizard_blocking_flag:
      int: 1
      action: set
    mode_nosleeptilbrooklyn_score:
      int: 0
      action: set
    modes_played: 1
    battery_charged_yesorno:
      int: 0
      action: set
    active_mode:
      string: "No Sleep Til Brooklyn"
      action: set
    active_mode_objective:
      string: "Hit Lit Shots 3 Times To Turn Them Off"
      action: set
    final_wizard_level:
      int: 2
      action: set
  counter_nosleeptilbrooklyn_leftorbit_counter_hit:
    score: 5000000 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier * current_player.nosleeptilbrooklyn_leftorbit_counter
    mode_nosleeptilbrooklyn_score: 5000000 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier * current_player.nosleeptilbrooklyn_leftorbit_counter
    nosleeptilbrooklyn_leftorbit_counter:
      int: device.counters.nosleeptilbrooklyn_leftorbit_counter.value * 1
      action: set
  counter_nosleeptilbrooklyn_leftramp_counter_hit:
    score: 5000000 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier * current_player.nosleeptilbrooklyn_leftramp_counter
    mode_nosleeptilbrooklyn_score: 5000000 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier * current_player.nosleeptilbrooklyn_leftramp_counter
    nosleeptilbrooklyn_leftramp_counter:
      int: device.counters.nosleeptilbrooklyn_leftramp_counter.value * 1
      action: set
  counter_nosleeptilbrooklyn_rightorbit_counter_hit:
    score: 5000000 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier * current_player.nosleeptilbrooklyn_rightorbit_counter
    mode_nosleeptilbrooklyn_score: 5000000 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier * current_player.nosleeptilbrooklyn_rightorbit_counter
    nosleeptilbrooklyn_rightorbit_counter:
      int: device.counters.nosleeptilbrooklyn_rightorbit_counter.value * 1
      action: set
  counter_nosleeptilbrooklyn_rightramp_counter_hit:
    score: 5000000 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier * current_player.nosleeptilbrooklyn_rightramp_counter
    mode_nosleeptilbrooklyn_score: 5000000 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier * current_player.nosleeptilbrooklyn_rightramp_counter
    nosleeptilbrooklyn_rightramp_counter:
      int: device.counters.nosleeptilbrooklyn_rightramp_counter.value * 1
      action: set
  counter_nosleeptilbrooklyn_upper_loop_counter_hit:
    score: 5000000 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier * current_player.nosleeptilbrooklyn_upper_loop_counter
    mode_nosleeptilbrooklyn_score: 5000000 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier * current_player.nosleeptilbrooklyn_upper_loop_counter
    nosleeptilbrooklyn_upper_loop_counter:
      int: device.counters.nosleeptilbrooklyn_upper_loop_counter.value * 1
      action: set
  right_inlane_hit:
    score:
      int: 110 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
      block: True
    mode_nosleeptilbrooklyn_score: 110 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
  left_inlane_hit:
    score:
      int: 110 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
      block: True
    mode_nosleeptilbrooklyn_score: 110 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
  s_left_slingshot_active:
