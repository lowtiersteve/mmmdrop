      int: 10 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
      block: True
    mode_nosleeptilbrooklyn_score: 10 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
  pop1_hit:
    score:
      int: 1110 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
      block: True
    mode_nosleeptilbrooklyn_score: 1110 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
  pop2_hit:
