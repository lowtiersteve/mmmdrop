      int: 1010 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
      block: True
    mode_nosleeptilbrooklyn_score: 1010 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier


event_player:
  s_right_orbit_active{device.counters.nosleeptilbrooklyn_upper_loop_counter.enabled==True and device.counters.nosleeptilbrooklyn_rightorbit_counter.enabled==False and device.diverters.up_post.active==False}: uppost_up
  s_left_orbit_active{device.diverters.up_post.active==False and device.sequences.nosleeptilbrooklyn_final_shot.enabled==True}: uppost_up
  inner_loop_hit: uppost_down
  s_inner_orbit_active: uppost_down


slide_player:
  mode_nosleeptilbrooklyn_started:
    current_mode_highlighted:
      action: remove
    base:
      action: remove
    basevideo1:
      action: remove
    basevideo2:
      action: remove
    basevideo3:
      action: remove
    basevideo4:
      action: remove
    basevideo5:
      action: remove
    basevideo6:
      action: remove
    basevideo7:
      action: remove
    basevideoricky:
      action: remove
    current_wizard_mode_highlighted:
      action: remove
    nosleeptilbrooklyn_intro:
      action: play
      priority: 500000
      expire: 26s
  slide_nosleeptilbrooklyn_intro_removed:
    nosleeptilbrooklyn:
      action: play
      priority: 500000
    nosleeptilbrooklyn_instructions:
      action: play
      priority: 505000
      expire: 7s


sound_player:
  mode_nosleeptilbrooklyn_started:
    base_game_random_music:
      action: stop
      bus: music
  slide_nosleeptilbrooklyn_intro_removed:
    nosleeptilbrooklynmusic:
      action: replace
      bus: music
      loops: 5
  nosleeptilbrooklyn_rightramp_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  nosleeptilbrooklyn_rightorbit_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  nosleeptilbrooklyn_leftramp_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  nosleeptilbrooklyn_leftorbit_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  nosleeptilbrooklyn_upper_loop_counter_complete:
    success_shot:
      action: play
      bus: effects
      max_queue_time: 500ms
  nosleeptilbrooklyn_enable_scoop:
    hitthescoop:
      action: play
      bus: voice


show_player:
  mode_nosleeptilbrooklyn_started:
    brassmonkey_backboard_red:
      action: stop
    brassmonkey_final_shot_show:
      action: stop
    nosleeptilbrooklyn_stadium_intro_lights:
      action: play
      loops: -1
    left_orbit_mult_show:
      action: stop
    left_ramp_mult_show:
      action: stop
    upper_loop_mult_show:
      action: stop
    scoop_mult_show:
      action: stop
    right_ramp_mult_show:
      action: stop
    right_orbit_mult_show:
      action: stop
  slide_nosleeptilbrooklyn_instructions_removed:
    nosleeptilbrooklyn_stadium_intro_lights:
      action: stop
    nosleeptilbrooklyn_leftorbit_green:
      action: play
      loops: -1
      priority: 500000
    nosleeptilbrooklyn_leftramp_green:
      action: play
      loops: -1
      priority: 500000
    nosleeptilbrooklyn_upperloop_green:
      action: play
      loops: -1
      priority: 500000
    nosleeptilbrooklyn_rightramp_green:
      action: play
      loops: -1
      priority: 500000
    nosleeptilbrooklyn_rightorbit_green:
      action: play
      loops: -1
      priority: 500000
    GI_on:
      action: play
      priority: 10000
    GI_backboard_on:
      action: play
      priority: 10000
    stadium_GI_on:
      action: play
      priority: 10000
  player_nosleeptilbrooklyn_leftorbit_counter{current_player.nosleeptilbrooklyn_leftorbit_counter==2}:
    nosleeptilbrooklyn_leftorbit_green:
      action: stop
    nosleeptilbrooklyn_leftorbit_yellow:
      action: play
      loops: -1
      priority: 500000
  player_nosleeptilbrooklyn_leftorbit_counter{current_player.nosleeptilbrooklyn_leftorbit_counter==3}:
    nosleeptilbrooklyn_leftorbit_yellow:
      action: stop
    nosleeptilbrooklyn_leftorbit_red:
      action: play
      loops: -1
      priority: 500000
  player_nosleeptilbrooklyn_leftorbit_counter{current_player.nosleeptilbrooklyn_leftorbit_counter==4}:
    nosleeptilbrooklyn_leftorbit_red:
      action: stop
  player_nosleeptilbrooklyn_leftramp_counter{current_player.nosleeptilbrooklyn_leftramp_counter==2}:
    nosleeptilbrooklyn_leftramp_green:
      action: stop
    nosleeptilbrooklyn_leftramp_yellow:
      action: play
      loops: -1
      priority: 500000
  player_nosleeptilbrooklyn_leftramp_counter{current_player.nosleeptilbrooklyn_leftramp_counter==3}:
    nosleeptilbrooklyn_leftramp_yellow:
      action: stop
    nosleeptilbrooklyn_leftramp_red:
      action: play
      loops: -1
      priority: 500000
  player_nosleeptilbrooklyn_leftramp_counter{current_player.nosleeptilbrooklyn_leftramp_counter==4}:
    nosleeptilbrooklyn_leftramp_red:
      action: stop
  player_nosleeptilbrooklyn_upper_loop_counter{current_player.nosleeptilbrooklyn_upper_loop_counter==2}:
    nosleeptilbrooklyn_upperloop_green:
      action: stop
    nosleeptilbrooklyn_upperloop_yellow:
      action: play
      loops: -1
      priority: 500000
  player_nosleeptilbrooklyn_upper_loop_counter{current_player.nosleeptilbrooklyn_upper_loop_counter==3}:
    nosleeptilbrooklyn_upperloop_yellow:
      action: stop
    nosleeptilbrooklyn_upperloop_red:
      action: play
      loops: -1
      priority: 500000
  player_nosleeptilbrooklyn_upper_loop_counter{current_player.nosleeptilbrooklyn_upper_loop_counter==4}:
    nosleeptilbrooklyn_upperloop_red:
      action: stop
    nosleeptilbrooklyn_right_orbit_uppost_show:
      action: stop
  player_nosleeptilbrooklyn_rightramp_counter{current_player.nosleeptilbrooklyn_rightramp_counter==2}:
    nosleeptilbrooklyn_rightramp_green:
      action: stop
    nosleeptilbrooklyn_rightramp_yellow:
      action: play
      loops: -1
      priority: 500000
  player_nosleeptilbrooklyn_rightramp_counter{current_player.nosleeptilbrooklyn_rightramp_counter==3}:
    nosleeptilbrooklyn_rightramp_yellow:
      action: stop
    nosleeptilbrooklyn_rightramp_red:
      action: play
      loops: -1
      priority: 500000
  player_nosleeptilbrooklyn_rightramp_counter{current_player.nosleeptilbrooklyn_rightramp_counter==4}:
    nosleeptilbrooklyn_rightramp_red:
      action: stop
  player_nosleeptilbrooklyn_rightorbit_counter{current_player.nosleeptilbrooklyn_rightorbit_counter==2}:
    nosleeptilbrooklyn_rightorbit_green:
      action: stop
    nosleeptilbrooklyn_rightorbit_yellow:
      action: play
      loops: -1
      priority: 500000
  player_nosleeptilbrooklyn_rightorbit_counter{current_player.nosleeptilbrooklyn_rightorbit_counter==3}:
    nosleeptilbrooklyn_rightorbit_yellow:
      action: stop
    nosleeptilbrooklyn_rightorbit_red:
      action: play
      loops: -1
      priority: 500000
  player_nosleeptilbrooklyn_rightorbit_counter{current_player.nosleeptilbrooklyn_rightorbit_counter==4}:
    nosleeptilbrooklyn_rightorbit_red:
      action: stop
  player_nosleeptilbrooklyn_rightorbit_counter{current_player.nosleeptilbrooklyn_rightorbit_counter==4 and device.counters.nosleeptilbrooklyn_upper_loop_counter.enabled==True}:
    nosleeptilbrooklyn_right_orbit_uppost_show:
      action: play
      loops: -1
  nosleeptilbrooklyn_enable_scoop:
    nosleeptilbrooklyn_final_shot_show:
      action: play
      priority: 50000
      loops: -1


ball_saves:
  fake_nosleeptilbrooklyn_ball_save:
    enable_events: nosleeptilbrooklyn_finish
    auto_launch: false
    balls_to_save: 1
    debug: true



blinkenlight_player:
  mode_nosleeptilbrooklyn_started:
    bl_left_orbit_x: remove
    bl_left_ramp_x: remove
    bl_inner_loop_x: remove
    bl_scoop_x: remove
    bl_right_ramp_x: remove
    bl_right_orbit_x: remove
