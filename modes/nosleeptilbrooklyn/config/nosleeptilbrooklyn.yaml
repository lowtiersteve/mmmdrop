      int: 1010 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
      block: True
    mode_nosleeptilbrooklyn_score: 1010 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
  bottom_drop_hit:
    score:
      int: 2220 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
      block: True
    mode_nosleeptilbrooklyn_score: 2220 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
  middle_drop_hit:
    score:
      int: 2220 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
      block: True
    mode_nosleeptilbrooklyn_score: 2220 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
  top_drop_hit:
    score:
      int: 2220 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
      block: True
    mode_nosleeptilbrooklyn_score: 2220 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
  three_bank_standup_hit:
    score:
      int: 20010 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
      block: True
    mode_nosleeptilbrooklyn_score: 20010 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
  s_left_orbit_active:
    score:
      int: 110 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
      block: True
    mode_nosleeptilbrooklyn_score: 110 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
  s_right_orbit_active:
    score:
      int: 110 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
      block: True
