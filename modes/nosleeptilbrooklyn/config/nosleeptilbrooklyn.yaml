      int: 1110 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
      block: True
    mode_nosleeptilbrooklyn_score: 1110 * current_player.playfield_x * current_player.nosleeptilbrooklyn_mode_multiplier
  spinner_hit:
