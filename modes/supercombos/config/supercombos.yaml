#config_version=6

mode:
  start_events: start_supercombos
  stop_events: mode_supercombos_complete
  priority: 20000

variable_player:
  combo_hit:
    score: 100000 * current_player.playfield_x

timers:
  supercombos_timer:
    start_value: 0
    end_value: 30
    tick_interval: 1s
    start_running: True
    control_events:
      - event: mode_supercombos_started
        action: restart
      - event: ball_ending
        action: stop

event_player:
  timer_supercombos_timer_complete: mode_supercombos_complete

sound_player:
  mode_supercombos_started:
    supercombos_callout:
      action: play
      bus: voice
