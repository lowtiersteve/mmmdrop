#config_version=6

mode:
  start_events: start_supercombos
  stop_events: mode_supercombos_complete
  priority: 20000

variable_player:
  combo_hit:
    score: 100000 * current_player.playfield_x

timers:
  supercombos_timer:
    start_value: 0
    end_value: 30
    tick_interval: 1s
    start_running: True
    control_events:
      - event: mode_supercombos_started
        action: restart
      - event: ball_ending
        action: stop


event_player:
  timer_supercombos_timer_complete: mode_supercombos_complete


random_event_player:
  mode_supercombos_started:
    events:
      - djhurricane1_sound
      - djhurricane2_sound
      - djhurricane3_sound
      - djhurricane4_sound
      - djhurricane5_sound


sound_player:
  djhurricane1_sound:
    name_djhurricane_1:
      action: load
      bus: voice
    supercombos_callout:
      action: load
      bus: voice
  djhurricane2_sound:
    name_djhurricane_2:
      action: load
      bus: voice
    supercombos_callout:
      action: load
      bus: voice
  djhurricane3_sound:
    name_djhurricane_3:
      action: load
      bus: voice
    supercombos_callout:
      action: load
      bus: voice
  djhurricane4_sound:
    name_djhurricane_4:
      action: load
      bus: voice
    supercombos_callout:
      action: load
      bus: voice
  djhurricane5_sound:
    name_djhurricane_5:
      action: load
      bus: voice
    supercombos_callout:
      action: load
      bus: voice
