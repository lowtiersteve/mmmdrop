#config_version=6

# mike is using this for the numbers
# https://fastpinball.com/cookbook/lower-third/
# https://fastpinball.com/mpf/config/net/


hardware:
  platform: fast
  driverboards: fast

fast:
  net:
    controller: neuron
    io_loop:
      cab:
        model: FP-I/O-0024
        order: 1
      "3208":
        model: FP-I/O-3208
        order: 2
      "0804":
        model: FP-I/O-0804
        order: 3
      "0804b":
        model: FP-I/O-0804
        order: 4

  exp:
    boards:
      lightboard:
        model: FP-EXP-0081
    port: COM4
    baud: 921600
    debug: False

  aud:
    port: auto
    debug: False

    main_amp_enabled: True
    sub_amp_enabled: True
    headphones_amp_enabled: True

    main_steps: 10
    sub_steps: 10
    headphones_steps: 10

    default_main_volume: 80
    default_sub_volume: 80
    default_headphones_volume: 60

    persist_volume_settings: True

    max_hw_volume_main: 100
    max_hw_volume_sub: 100
    max_hw_volume_headphones: 100

    main_levels_list: None
    sub_levels_list: None
    headphones_levels_list: None

    link_sub_to_main: True
    link_headphones_to_main: True

    headphones_level: line
    mute_speakers_with_headphones: True


displays:
  window:
    width: 1920
    height: 1080

slide_player:
  init_done:
    loading:
      action: play

config:
  - coils.yaml
  - switches.yaml
  - lights.yaml

machine_vars:
  game_just_played:
    initial_value: 0
    persist: False
    value_type: int


playfields:
  playfield:
    tags: default
    default_source_device: bd_plunger
    enable_ball_search: False

flippers:
  left_flipper:
    main_coil: c_flipper_left_main
    hold_coil: c_flipper_left_hold
    activation_switch: s_left_flipper
  right_flipper:
    main_coil: c_flipper_right_main
    hold_coil: c_flipper_right_hold
    activation_switch: s_right_flipper
  top_right_flipper:
    main_coil: c_flipper_top_right_main
    hold_coil: c_flipper_top_right_hold
    activation_switch: s_top_right_flipper

ball_devices:
  bd_trough:
    ball_switches: s_trough1, s_trough2, s_trough3, s_trough4, s_trough5, s_trough6, s_trough_jam
    eject_coil: c_trough_eject
    tags: trough, home, drain
    jam_switch: s_trough_jam
    eject_coil_jam_pulse: 15ms
    eject_targets: bd_plunger
    eject_timeouts: 3s
  bd_plunger:
    ball_switches: s_plunger
    mechanical_eject: True
    eject_coil: c_plunger
    eject_timeouts: 3s
  bd_scoop:
    ball_switches: s_scoop
    eject_coil: c_scoop_eject
    eject_timeouts: 3s

ball_saves:
  default:
    active_time: 10s
    hurry_up_time: 4s
    grace_period: 2s
    enable_events: mode_base_started
    timer_start_events: ball_out
    auto_launch: True
    balls_to_save: -1
  mode_start:
    active_time: 5s
    hurry_up_time: 2s
    grace_period: 1s
    enable_events: ball_hold_fingerlickingood_scoop_hold_balls_released, ball_hold_highplainsdrifter_scoop_hold_balls_released, ball_hold_intergalactic_scoop_hold_balls_released, ball_hold_paulrevere_scoop_hold_balls_released, ball_hold_sabotage_scoop_hold_balls_released, ball_hold_threemcsand1dj_scoop_hold_balls_released, ball_hold_toomanyrappers_scoop_hold_balls_released, ball_hold_tripletrouble_scoop_hold_balls_released
    auto_launch: True
    balls_to_save: -1
  girls_frenzy:
    active_time: 38s
    hurry_up_time: 5s
    grace_period: 1s
    enable_events: mode_girls_started
    auto_launch: True
    balls_to_save: -1


modes:
  - base
  - attract
  - skill_shot
  - multiball
  - carousel
  - intergalactic
  - paulrevere
  - service
  - makesomenoise
  - tilt
  - tripletrouble
  - bonus
  - combos
  - batterycharger
  - sabotage
  - fingerlickingood
  - toomanyrappers
  - threemcsand1dj
  - chcheckitout
  - bodymovin
  - highplainsdrifter
  - superpops
  - superdrops
  - superspins
  - superstandups
  - supercombos
  - girls
  - highscore


settings:
  replay_score:
    label: "Replay Score"
    values:
      50000000: "50,000,000"
      100000000: "100,000,000 (Default)"
      200000000: "200,000,000"
    default: 100000000
    key_type: int
    sort: 100
  warnings_to_tilt:
    label: "Number of Tilts to Tilt"
    values:
      0: "0 (No Warnings)"
      1: "1"
      2: "2"
      3: "3 (Default)"
      5: "5"
      10: "10"
    default: 3
    key_type: int
    sort: 600
  settle_time:
    label: "Time Tilt Bob Takes to Settle (Start Next Ball)"
    values:
      3000: "3 Seconds"
      5000: "5 Seconds (Default)"
      10000: "10 Seconds"
    default: 5000
    key_type: int
    sort: 610
  multiple_hit_window:
    label: "Tilt Sensitivity"
    values:
      150: "Sensitive"
      300: "Normal (Default)"
      500: "Insensitive"
      1000: "Very Insensitive"
    default: 300
    key_type: int
    sort: 620


event_player:
  machine_reset_phase_2:
    game_just_played:
      action: set_machine
      int: 0


variable_player:
  game_started:
    game_just_played:
      action: set_machine
      int: 1


shot_profiles:
  lit_mode_shot_profile:
    states:
      - name: flashing
        show: flash
      - name: unlit
    loop: False


keyboard:
  s:
    switch: s_start
  1:
    switch: s_trough1
    toggle: True
  2:
    switch: s_trough2
    toggle: True
  3:
    switch: s_trough3
    toggle: True
  4:
    switch: s_trough4
    toggle: True
  5:
    switch: s_trough5
    toggle: True
  p:
    switch: s_plunger
    toggle: True
  m:
    switch: s_scoop
    toggle: True
  b:
    switch: s_right_lower_pop
  n:
    switch: s_center_upper_pop
  u:
    switch: s_three_bank_bottom
    toggle: True
  i:
    switch: s_three_bank_middle
    toggle: True
  o:
    switch: s_three_bank_top
    toggle: True
  y:
    switch: s_three_bank_standup
  d:
    switch: s_left_flipper
  f:
    switch: s_right_flipper
  q:
    switch: s_service_esc
  w:
    switch: s_service_down
  e:
    switch: s_service_up
  r:
    switch: s_service_enter

