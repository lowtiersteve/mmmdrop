[sound_system]

music={"type": "solo"}
effects={"default": true, "simultaneous_sounds": 3, "type": "simultaneous"}
voice={"type": "sequential"}

[keyboard]

s=["switch", "s_start"]
1=["switch", "s_trough1", "toggle"]
2=["switch", "s_trough2", "toggle"]
3=["switch", "s_trough3", "toggle"]
4=["switch", "s_trough4", "toggle"]
5=["switch", "s_trough5", "toggle"]
p=["switch", "s_plunger", "toggle"]
m=["switch", "s_scoop", "toggle"]
b=["switch", "s_right_lower_pop"]
u=["switch", "s_three_bank_bottom", "toggle"]
i=["switch", "s_three_bank_middle", "toggle"]
o=["switch", "s_three_bank_top", "toggle"]
y=["switch", "s_three_bank_standup"]
q=["switch", "s_service_esc"]
w=["switch", "s_service_down"]
e=["switch", "s_service_up"]
r=["switch", "s_service_enter"]


[gmc]

fullscreen=true
exit_on_esc=true
logging_global=1
logging_server=0
logging_game=0
logging_media=10
logging_process=0
logging_sound_player=0

[mpf]

virtual=true
verbose=false
spawn_mpf=false
mpf_args="-m mpf"
