[sound_system]

music={
"type": "solo"
}
effects={
"default": true,
"simultaneous_sounds": 3,
"type": "simultaneous"
}
voice={
"type": "sequential"
}

[keyboard]

s=["switch", "s_start"]
1=["switch", "s_trough1", "toggle"]
2=["switch", "s_trough2", "toggle"]
3=["switch", "s_trough3", "toggle"]
4=["switch", "s_trough4", "toggle"]
5=["switch", "s_trough5", "toggle"]
p=["switch", "s_plunger", "active"]
m=["switch", "s_scoop", "active"]
b=["switch", "s_right_lower_pop", "active"]
u=["switch", "s_three_bank_bottom", "toggle"]
i=["switch", "s_three_bank_middle", "toggle"]
o=["switch", "s_three_bank_top", "toggle"]
y=["switch", "s_three_bank_standup", "active"]
enter=["switch", "s_start", "active"]

[gmc]

fullscreen=true
exit_on_esc=true
logging_global=1
logging_server=0
logging_game=0
logging_media=10
logging_process=0
logging_sound_player=0

[mpf]

executable_args="-m mpf"
virtual=true
verbose=false
spawn_mpf=false
